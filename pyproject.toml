[tool.poetry]
name = "codecraftai-configuration"
description = "Code Craft AI - Configuration"
version = "0.0.1"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pyyaml = "^6.0.2"
cryptography = "^45.0.5"
requests = "^2.32.4"
codecraftai-errors = { git = "https://github.com/automationmojo/codecraftai-errors.git", branch = "main" }
codecraftai-credentials = { git = "https://github.com/automationmojo/codecraftai-credentials.git", branch = "main" }
codecraftai-this-app = { git = "https://github.com/automationmojo/codecraftai-this-app.git", branch = "main" }
codecraftai-xmodules = { git = "https://github.com/automationmojo/codecraftai-xmodules.git", branch = "main" }
codecraftai-interfaces = { git = "https://github.com/automationmojo/codecraftai-interfaces.git", branch = "main" }
codecraftai-networking = { git = "https://github.com/automationmojo/codecraftai-networking.git", branch = "main" }
codecraftai-provisioning = { git = "https://github.com/automationmojo/codecraftai-provisioning.git", branch = "main" }

couchdb = { version="^1.2", optional = true}
pymongo = { version="^4.13.2", optional = true }

[tool.poetry.extras]
couchdb = ["couchdb"]
pymongo = ["pymongo"]

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
