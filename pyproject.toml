[tool.poetry]
name = "codecraftai-configuration"
description = "Code Craft AI - Configuration"
version = "1.0.0"
authors = ["Myron Walker <myron.walker@gmail.com>"]
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pyyaml = "^6.0.2"
cryptography = "^45.0.5"
requests = "^2.32.4"
codecraftai-errors = { version = "<2.0.0", source = "codecraftai" }
codecraftai-credentials = { version = "<2.0.0", source = "codecraftai" }
codecraftai-this-app = { version = "<2.0.0", source = "codecraftai" }
codecraftai-xmodules = { version = "<2.0.0", source = "codecraftai" }
codecraftai-interfaces = { version = "<2.0.0", source = "codecraftai" }

couchdb = { version="^1.2", optional = true}
pymongo = { version="^4.13.2", optional = true }

[tool.poetry.extras]
couchdb = ["couchdb"]
pymongo = ["pymongo"]

[tool.poetry.group.dev.dependencies]


[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
