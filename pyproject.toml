[tool.poetry]
name = "automojo-configuration"
description = "Automation Mojo - Configuration"
version = "0.0.1"
authors = ['Myron W. Walker']
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="automojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pyyaml = "^6.0.2"
cryptography = "^45.0.5"
requests = "^2.32.4"
automojo-errors = { git = "https://github.com/automationmojo/automojo-errors.git", branch = "main" }
automojo-this-app = { git = "https://github.com/automationmojo/automojo-this-app.git", branch = "main" }
automojo-xmodules = { git = "https://github.com/automationmojo/automojo-xmodules.git", branch = "main" }
automojo-interfaces = { git = "https://github.com/automationmojo/automojo-interfaces.git", branch = "main" }
automojo-networking = { git = "https://github.com/automationmojo/automojo-networking.git", branch = "main" }
automojo-provisioning = { git = "https://github.com/automationmojo/automojo-provisioning.git", branch = "main" }

couchdb = { version="^1.2", optional = true}
pymongo = { version="^4.13.2", optional = true }

[tool.poetry.extras]
couchdb = ["couchdb"]
pymongo = ["pymongo"]

[tool.poetry.group.dev.dependencies]

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
